[project]
name = "iscore-sqlserver-backend"
version = "0.1.0"
description = "SQL Server data source API for iScore Analytics."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.7.0",
    "uvicorn[standard]>=0.30.0",
    "pyodbc>=5.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
